<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>腳本上傳</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
    --text: #e8eaed; --text-dim: #9aa1ac; --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    display: flex; justify-content: center; padding: 40px 16px;
  }
  .card {
    width: 100%; max-width: 640px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 28px;
  }
  h1 { margin: 0 0 6px; font-size: 1.3rem; }
  p.sub { color: var(--text-dim); margin: 0 0 20px; font-size: 0.9rem; }
  textarea {
    width: 100%; min-height: 260px; background: #0b0d11; color: #c9d1d9;
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-family: "Cascadia Code", Consolas, monospace; font-size: 0.85rem;
    resize: vertical;
  }
  button {
    margin-top: 14px; background: var(--accent); color: #fff; border: none;
    padding: 10px 18px; border-radius: 8px; font-size: 0.95rem; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .result {
    margin-top: 18px; padding: 14px; background: #0b0d11;
    border: 1px solid var(--border); border-radius: 8px; display: none;
  }
  .result.show { display: block; }
  .result label { font-size: 0.75rem; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .result .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .result input {
    flex: 1; background: #171a21; border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 6px; font-family: monospace; font-size: 0.8rem;
  }
  .result button.copy {
    margin: 0; padding: 8px 12px; font-size: 0.8rem; background: transparent;
    border: 1px solid var(--border); color: var(--text);
  }
  .result button.copy:hover { border-color: var(--accent); color: var(--accent); }
  .error { color: #ff6b6b; margin-top: 10px; font-size: 0.85rem; display: none; }
  .error.show { display: block; }
  .success { color: #4ade80; margin-top: 10px; font-size: 0.85rem; display: none; }
  .success.show { display: block; }
  .section-title { margin: 32px 0 6px; font-size: 1.05rem; }
  .btn-danger { background: #b91c1c; }
  input#disableInput {
    width: 100%; background: #0b0d11; color: #c9d1d9;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-family: monospace; font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>上傳您的 Roblox 腳本</h1>
    <p class="sub">貼上腳本內容，上傳後會產生一個可公開存取的原始檔連結。</p>
    <textarea id="code" placeholder="-- 在這裡貼上您的 Lua 腳本"></textarea>
    <br>
    <button id="uploadBtn">上傳並產生連結</button>
    <p class="error" id="errorMsg"></p>

    <div class="result" id="result">
      <label>原始檔連結</label>
      <div class="row">
        <input id="rawUrl" readonly>
        <button class="copy" data-target="rawUrl">複製</button>
      </div>
      <label>執行器載入指令</label>
      <div class="row">
        <input id="loadCmd" readonly>
        <button class="copy" data-target="loadCmd">複製</button>
      </div>
      <button class="btn-danger" id="disableJustUploaded" disabled>停用這個連結</button>
    </div>

    <h2 class="section-title">停用舊的腳本連結</h2>
    <p class="sub">貼上腳本 ID 或完整連結，停用後該連結會永久失效。</p>
    <input id="disableInput" placeholder="例如：AbCd1234 或 https://.../7zx67/AbCd1234">
    <button class="btn-danger" id="disableBtn">停用</button>
    <p class="error" id="disableError"></p>
    <p class="success" id="disableSuccess"></p>
  </div>

  <script>
    const uploadBtn = document.getElementById("uploadBtn");
    const codeInput = document.getElementById("code");
    const result = document.getElementById("result");
    const rawUrlInput = document.getElementById("rawUrl");
    const loadCmdInput = document.getElementById("loadCmd");
    const errorMsg = document.getElementById("errorMsg");
    const disableJustUploaded = document.getElementById("disableJustUploaded");
    const disableInput = document.getElementById("disableInput");
    const disableBtn = document.getElementById("disableBtn");
    const disableError = document.getElementById("disableError");
    const disableSuccess = document.getElementById("disableSuccess");

    let lastUploadedId = null;

    function extractId(value) {
      const trimmed = value.trim();
      const match = trimmed.match(/\/7zx67\/([A-Za-z0-9_-]+)/);
      if (match) return match[1];
      if (/^[A-Za-z0-9_-]+$/.test(trimmed)) return trimmed;
      return null;
    }

    async function disableId(id) {
      const res = await fetch("/api/disable", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "停用失敗");
      return data;
    }

    uploadBtn.addEventListener("click", async () => {
      const code = codeInput.value;
      errorMsg.classList.remove("show");
      if (!code.trim()) {
        errorMsg.textContent = "請先貼上腳本內容。";
        errorMsg.classList.add("show");
        return;
      }
      uploadBtn.disabled = true;
      uploadBtn.textContent = "上傳中...";
      try {
        const res = await fetch("/api/upload", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "上傳失敗");
        rawUrlInput.value = data.rawUrl;
        loadCmdInput.value = `loadstring(game:HttpGet("${data.rawUrl}"))()`;
        lastUploadedId = data.id;
        disableJustUploaded.disabled = false;
        disableJustUploaded.textContent = "停用這個連結";
        result.classList.add("show");
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.add("show");
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = "上傳並產生連結";
      }
    });

    disableJustUploaded.addEventListener("click", async () => {
      if (!lastUploadedId) return;
      disableJustUploaded.disabled = true;
      disableJustUploaded.textContent = "停用中...";
      try {
        await disableId(lastUploadedId);
        disableJustUploaded.textContent = "已停用";
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.add("show");
        disableJustUploaded.disabled = false;
        disableJustUploaded.textContent = "停用這個連結";
      }
    });

    disableBtn.addEventListener("click", async () => {
      disableError.classList.remove("show");
      disableSuccess.classList.remove("show");
      const id = extractId(disableInput.value);
      if (!id) {
        disableError.textContent = "請輸入有效的腳本 ID 或連結。";
        disableError.classList.add("show");
        return;
      }
      disableBtn.disabled = true;
      disableBtn.textContent = "停用中...";
      try {
        await disableId(id);
        disableSuccess.textContent = `已停用：${id}`;
        disableSuccess.classList.add("show");
        disableInput.value = "";
      } catch (err) {
        disableError.textContent = err.message;
        disableError.classList.add("show");
      } finally {
        disableBtn.disabled = false;
        disableBtn.textContent = "停用";
      }
    });

    document.querySelectorAll(".copy").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const target = document.getElementById(btn.dataset.target);
        await navigator.clipboard.writeText(target.value);
        const original = btn.textContent;
        btn.textContent = "已複製！";
        setTimeout(() => (btn.textContent = original), 1200);
      });
    });
  </script>
</body>
</html>
