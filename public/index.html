<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Manager</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f5f6f8; --panel-hover: #eceef1; --border: #dde1e6;
    --text: #1a1d21; --text-dim: #6b7280; --accent: #3b6fe0; --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", sans-serif;
    display: flex; height: 100vh; overflow: hidden;
  }
  .sidebar {
    width: 260px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-size: 1rem; margin: 0 0 10px; }
  .new-btn {
    width: 100%; background: var(--accent); color: #fff; border: none;
    padding: 9px; border-radius: 8px; font-size: 0.85rem; cursor: pointer;
  }
  .script-list { flex: 1; overflow-y: auto; padding: 8px; }
  .script-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-family: monospace; font-size: 0.82rem; color: var(--text-dim);
    margin-bottom: 4px; word-break: break-all;
  }
  .script-item:hover { background: var(--panel-hover); color: var(--text); }
  .script-item.active { background: #e4ebff; color: var(--accent); }
  .empty-list { padding: 20px 12px; color: var(--text-dim); font-size: 0.85rem; }

  .main { flex: 1; padding: 32px; overflow-y: auto; }
  .main-inner { max-width: 720px; margin: 0 auto; }
  h2 { margin: 0 0 6px; font-size: 1.2rem; }
  p.sub { color: var(--text-dim); margin: 0 0 18px; font-size: 0.9rem; }
  .field-label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 6px; }
  #nameField { margin-bottom: 14px; }
  #customName {
    width: 100%; background: #fff; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font-family: monospace; font-size: 0.85rem;
  }
  textarea {
    width: 100%; min-height: 320px; background: #fff; color: #1a1d21;
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-family: "Cascadia Code", Consolas, monospace; font-size: 0.85rem;
    resize: vertical;
  }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #fff; border: none;
    padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; cursor: pointer;
  }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.danger { background: var(--danger); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .result {
    margin-top: 18px; padding: 14px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; display: none;
  }
  .result.show { display: block; }
  .result label { font-size: 0.75rem; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .result .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .result input {
    flex: 1; background: #fff; border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 6px; font-family: monospace; font-size: 0.8rem;
  }
  .result button.copy {
    margin: 0; padding: 8px 12px; font-size: 0.8rem; background: transparent;
    border: 1px solid var(--border); color: var(--text);
  }
  .result button.copy:hover { border-color: var(--accent); color: var(--accent); }

  .msg { margin-top: 10px; font-size: 0.85rem; display: none; }
  .msg.error { color: #dc2626; }
  .msg.success { color: #16a34a; }
  .msg.show { display: block; }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Uploaded Scripts</h1>
      <button class="new-btn" id="newBtn">+ New Script</button>
    </div>
    <div class="script-list" id="scriptList">
      <div class="empty-list">Loading...</div>
    </div>
  </div>

  <div class="main">
    <div class="main-inner">
      <h2 id="pageTitle">New Script</h2>
      <p class="sub" id="pageSub">Paste your script content below. Uploading creates a publicly accessible raw link.</p>
      <div id="nameField">
        <label class="field-label">Custom link name (optional, leave blank for a random ID)</label>
        <input id="customName" placeholder="e.g. my-script (letters, numbers, - and _ only)">
      </div>
      <textarea id="code" placeholder="-- Paste your Lua script here"></textarea>

      <div class="actions">
        <button id="uploadBtn">Upload &amp; Get Link</button>
        <button class="secondary" id="updateBtn" style="display:none">Save Changes</button>
        <button class="danger" id="disableBtn" style="display:none">Disable This Script</button>
      </div>

      <p class="msg error" id="errorMsg"></p>
      <p class="msg success" id="successMsg"></p>

      <div class="result" id="result">
        <label>Raw file link</label>
        <div class="row">
          <input id="rawUrl" readonly>
          <button class="copy" data-target="rawUrl">Copy</button>
        </div>
        <label>Executor load command</label>
        <div class="row">
          <input id="loadCmd" readonly>
          <button class="copy" data-target="loadCmd">Copy</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const scriptList = document.getElementById("scriptList");
    const newBtn = document.getElementById("newBtn");
    const pageTitle = document.getElementById("pageTitle");
    const pageSub = document.getElementById("pageSub");
    const codeInput = document.getElementById("code");
    const customNameInput = document.getElementById("customName");
    const nameField = document.getElementById("nameField");
    const uploadBtn = document.getElementById("uploadBtn");
    const updateBtn = document.getElementById("updateBtn");
    const disableBtn = document.getElementById("disableBtn");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const result = document.getElementById("result");
    const rawUrlInput = document.getElementById("rawUrl");
    const loadCmdInput = document.getElementById("loadCmd");

    let currentId = null; // null = new-script mode

    function origin() {
      return window.location.origin;
    }

    function rawUrlFor(id) {
      return `${origin()}/7zx67/${id}`;
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add("show");
      successMsg.classList.remove("show");
    }
    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.classList.add("show");
      errorMsg.classList.remove("show");
    }
    function clearMsgs() {
      errorMsg.classList.remove("show");
      successMsg.classList.remove("show");
    }

    async function loadList() {
      try {
        const res = await fetch("/api/scripts");
        const data = await res.json();
        renderList(data.ids || []);
      } catch {
        scriptList.innerHTML = '<div class="empty-list">Failed to load list</div>';
      }
    }

    function renderList(ids) {
      if (ids.length === 0) {
        scriptList.innerHTML = '<div class="empty-list">No scripts yet</div>';
        return;
      }
      scriptList.innerHTML = "";
      ids.forEach((id) => {
        const item = document.createElement("div");
        item.className = "script-item" + (id === currentId ? " active" : "");
        item.textContent = id;
        item.addEventListener("click", () => selectScript(id));
        scriptList.appendChild(item);
      });
    }

    function setMode(mode) {
      if (mode === "new") {
        currentId = null;
        pageTitle.textContent = "New Script";
        pageSub.textContent = "Paste your script content below. Uploading creates a publicly accessible raw link.";
        codeInput.value = "";
        customNameInput.value = "";
        nameField.style.display = "";
        uploadBtn.style.display = "";
        updateBtn.style.display = "none";
        disableBtn.style.display = "none";
        result.classList.remove("show");
      } else {
        pageSub.textContent = `Editing: ${currentId}`;
        nameField.style.display = "none";
        uploadBtn.style.display = "none";
        updateBtn.style.display = "";
        disableBtn.style.display = "";
      }
      clearMsgs();
      loadList();
    }

    async function selectScript(id) {
      clearMsgs();
      currentId = id;
      pageTitle.textContent = "Edit Script";
      pageSub.textContent = `Editing: ${id}`;
      codeInput.value = "Loading...";
      nameField.style.display = "none";
      uploadBtn.style.display = "none";
      updateBtn.style.display = "";
      disableBtn.style.display = "";
      result.classList.add("show");
      rawUrlInput.value = rawUrlFor(id);
      loadCmdInput.value = `loadstring(game:HttpGet("${rawUrlFor(id)}"))()`;
      loadList();

      try {
        const res = await fetch(`/api/scripts/${id}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load");
        codeInput.value = data.code;
      } catch (err) {
        showError(err.message);
        codeInput.value = "";
      }
    }

    newBtn.addEventListener("click", () => setMode("new"));

    uploadBtn.addEventListener("click", async () => {
      const code = codeInput.value;
      clearMsgs();
      if (!code.trim()) {
        showError("Please paste some script content first.");
        return;
      }
      uploadBtn.disabled = true;
      uploadBtn.textContent = "Uploading...";
      try {
        const name = customNameInput.value.trim();
        const res = await fetch("/api/upload", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code, name: name || undefined }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Upload failed");
        rawUrlInput.value = data.rawUrl;
        loadCmdInput.value = `loadstring(game:HttpGet("${data.rawUrl}"))()`;
        result.classList.add("show");
        currentId = data.id;
        pageTitle.textContent = "Edit Script";
        showSuccess("Uploaded successfully!");
        loadList();
      } catch (err) {
        showError(err.message);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = "Upload & Get Link";
      }
    });

    updateBtn.addEventListener("click", async () => {
      if (!currentId) return;
      const code = codeInput.value;
      clearMsgs();
      if (!code.trim()) {
        showError("Content cannot be empty.");
        return;
      }
      updateBtn.disabled = true;
      updateBtn.textContent = "Saving...";
      try {
        const res = await fetch(`/api/scripts/${currentId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Update failed");
        showSuccess("Changes saved.");
      } catch (err) {
        showError(err.message);
      } finally {
        updateBtn.disabled = false;
        updateBtn.textContent = "Save Changes";
      }
    });

    disableBtn.addEventListener("click", async () => {
      if (!currentId) return;
      if (!confirm(`Disable "${currentId}"? The link will stop working permanently.`)) return;
      clearMsgs();
      disableBtn.disabled = true;
      disableBtn.textContent = "Disabling...";
      try {
        const res = await fetch("/api/disable", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: currentId }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Disable failed");
        showSuccess(`Disabled: ${currentId}`);
        setMode("new");
      } catch (err) {
        showError(err.message);
      } finally {
        disableBtn.disabled = false;
        disableBtn.textContent = "Disable This Script";
      }
    });

    document.querySelectorAll(".copy").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const target = document.getElementById(btn.dataset.target);
        await navigator.clipboard.writeText(target.value);
        const original = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => (btn.textContent = original), 1200);
      });
    });

    loadList();
  </script>
</body>
</html>
